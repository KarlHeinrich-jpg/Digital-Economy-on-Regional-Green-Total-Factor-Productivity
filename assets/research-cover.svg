<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">数字经济与区域绿色全要素生产率</title>
  <desc id="desc">以数字网络、增长曲线和绿色叶片为主题的研究项目封面</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="0.52" stop-color="#0c3341"/>
      <stop offset="1" stop-color="#07584c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d1fae5" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#background)"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1080" cy="128" r="245" fill="url(#glow)"/>
  <circle cx="112" cy="365" r="190" fill="url(#glow)" opacity=".45"/>

  <g opacity=".65" stroke="#99f6e4" stroke-width="1.4">
    <path d="M890 98 L1012 54 L1133 115 L1190 238 L1076 320 L925 276 Z" fill="none"/>
    <path d="M890 98 L1015 178 L1133 115 M1015 178 L925 276 M1015 178 L1076 320 M1015 178 L1190 238" fill="none"/>
    <path d="M1133 115 L1190 238 M890 98 L925 276 M925 276 L1076 320" fill="none"/>
  </g>
  <g fill="#ccfbf1">
    <circle cx="890" cy="98" r="5"/>
    <circle cx="1012" cy="54" r="7"/>
    <circle cx="1133" cy="115" r="5"/>
    <circle cx="1190" cy="238" r="7"/>
    <circle cx="1076" cy="320" r="6"/>
    <circle cx="925" cy="276" r="5"/>
    <circle cx="1015" cy="178" r="10" fill="#5eead4"/>
  </g>

  <path d="M800 320 C860 294 910 301 954 260 C999 219 1025 213 1090 225 C1139 234 1178 205 1218 159"
        fill="none" stroke="#4ade80" stroke-opacity=".2" stroke-width="18" filter="url(#softGlow)"/>
  <path d="M800 320 C860 294 910 301 954 260 C999 219 1025 213 1090 225 C1139 234 1178 205 1218 159"
        fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M1198 163 C1194 126 1217 99 1252 88 C1254 124 1233 151 1198 163 Z" fill="#86efac"/>
  <path d="M1199 163 C1216 138 1232 117 1252 88" fill="none" stroke="#064e3b" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
    <text x="74" y="86" fill="#6ee7b7" font-size="18" font-weight="700" letter-spacing="3">RESEARCH DATA · SPATIAL ECONOMETRICS</text>
    <text x="72" y="160" fill="#f0fdfa" font-size="48" font-weight="800">DIGITAL ECONOMY ×</text>
    <text x="72" y="219" fill="#f0fdfa" font-size="48" font-weight="800">GREEN PRODUCTIVITY</text>
    <text x="74" y="260" fill="#bae6d6" font-size="20" font-weight="400">Regional GTFP · Provincial Panel Research Toolkit</text>

    <g transform="translate(74 312)">
      <rect width="132" height="40" rx="20" fill="#ffffff" fill-opacity=".10" stroke="#a7f3d0" stroke-opacity=".25"/>
      <circle cx="22" cy="20" r="5" fill="#4ade80"/>
      <text x="37" y="26" fill="#ecfdf5" font-size="14" font-weight="600">PANEL DATA</text>
    </g>
    <g transform="translate(220 312)">
      <rect width="148" height="40" rx="20" fill="#ffffff" fill-opacity=".10" stroke="#a7f3d0" stroke-opacity=".25"/>
      <circle cx="22" cy="20" r="5" fill="#67e8f9"/>
      <text x="37" y="26" fill="#ecfdf5" font-size="14" font-weight="600">SPATIAL MODELS</text>
    </g>
    <g transform="translate(382 312)">
      <rect width="146" height="40" rx="20" fill="#ffffff" fill-opacity=".10" stroke="#a7f3d0" stroke-opacity=".25"/>
      <circle cx="22" cy="20" r="5" fill="#fde68a"/>
      <text x="37" y="26" fill="#ecfdf5" font-size="15" font-weight="600">Stata · MATLAB</text>
    </g>
